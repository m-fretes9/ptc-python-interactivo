<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
body{font-family:Inter,system-ui,Arial;margin:30px;color:#111827}.row{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;max-width:1200px}.node{height:92px;border:1px solid #cbd5e1;border-radius:5px;background:#e5e7eb;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:650;font-size:12px;line-height:1.15;cursor:pointer;transition:.14s}.node:hover{background:#d7dce2;transform:translateY(-1px)}.node.active{background:#59616d;color:#fff;border-color:#374151}.node b{font-size:15px}.title{font-size:22px;font-weight:700;margin-bottom:18px}.hint{margin-top:12px;color:#64748b;font-size:13px}
</style></head><body><div class="title">Selector axial interactivo</div><div class="row" id="row"></div><div class="hint" id="hint">Nodo activo: 1</div><script>
const dh=[21.8,21.7,21.6,21.5,21.4,21.3,21.2,21.1,21.0,20.9,20.8,20.7];let active=0;const row=document.getElementById('row');function render(){row.innerHTML='';dh.forEach((q,i)=>{const d=document.createElement('div');d.className='node'+(i===active?' active':'');d.innerHTML=`<b>${i+1}</b><span>→</span><span>ΔH ${q.toFixed(1)} W</span>`;d.onclick=()=>{active=i;document.getElementById('hint').textContent='Nodo activo: '+(i+1);render()};row.appendChild(d)})}render();
</script></body></html>
